services:
  citacloud:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: citacloud-staging
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - citacloud_staging_uploads:/app/uploads

volumes:
  citacloud_staging_uploads:
