# Application Configuration - CitaCloud
spring.application.name=cita-cloud

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/cita_cloud
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:FRANpostgres1990}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Vaadin Settings
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.citacloud.app

# Cierre de sesión por inactividad.
server.servlet.session.timeout=15m

# Archivos de instituciones: se almacenan en disco, no en PostgreSQL.
app.upload-dir=uploads
