spring:
  application:
    name: cita-cloud
  profiles:
    # Facilita la ejecución desde IntelliJ. Staging y producción siguen siendo explícitos.
    default: local
  datasource:
    # Permite iniciar localmente aun cuando el IDE no active el perfil local.
    # Las credenciales reales siguen llegando únicamente por variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cita_cloud}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: ${DB_SLOW_QUERY_THRESHOLD_MS:1000}
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

server:
  servlet:
    session:
      timeout: 15m

vaadin:
  launch-browser: false
  whitelisted-packages: com.citacloud.app

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
    try-it-out-enabled: false
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus,info
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db,diskSpace
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      service: ${OTEL_SERVICE_NAME:cita-cloud-api}
      environment: ${DEPLOYMENT_ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        email.send.duration: true
        whatsapp.send.duration: true
        pdf.generation.duration: true
  tracing:
    enabled: ${OBSERVABILITY_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: ${OTEL_SERVICE_NAME:cita-cloud-api}
    environment: ${DEPLOYMENT_ENVIRONMENT:development}

app:
  upload-dir: uploads
  observability:
    service-name: ${OTEL_SERVICE_NAME:cita-cloud-api}
    environment: ${DEPLOYMENT_ENVIRONMENT:development}
    slow-http-threshold-ms: ${HTTP_SLOW_REQUEST_THRESHOLD_MS:1000}
  notifications:
    email:
      configured: ${NOTIFICATIONS_EMAIL_CONFIGURED:false}
    whatsapp:
      configured: ${NOTIFICATIONS_WHATSAPP_CONFIGURED:false}
      api-url: ${NOTIFICATIONS_WHATSAPP_API_URL:}
      token: ${NOTIFICATIONS_WHATSAPP_TOKEN:}
    worker:
      delay-ms: ${NOTIFICATIONS_WORKER_DELAY_MS:15000}
      max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:3}
